<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#f2f6f3">
<title>Parcial de Vendas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f6f3;
    --surface:#ffffff;
    --surface-2:#f0f5f1;
    --paper:#fbfdfb;
    --border:#dfe8e2;
    --border-soft:#e9f0eb;
    --text:#1e2a22;
    --text-dim:#5c6b60;
    --text-faint:#8fa096;
    --accent:#1e8a5c;
    --accent-2:#4fbe86;
    --accent-soft:rgba(30,138,92,.12);
    --danger:#c14a41;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:var(--bg);
    background-image:radial-gradient(circle at 50% -10%, rgba(30,138,92,.07), transparent 60%);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding:32px 14px 56px;
  }
  .page{display:flex;justify-content:center;}
  .card{
    width:100%;
    max-width:460px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(20,40,30,.18);
  }
  .card-header{
    padding:26px 24px 20px;
    border-bottom:1px solid var(--border-soft);
    display:flex;
    align-items:center;
    gap:14px;
  }
  .header-icon{
    width:44px;height:44px;border-radius:12px;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;
  }
  .header-text .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 3px;
  }
  .header-text h1{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:600;
    margin:0;
    letter-spacing:-.01em;
  }
  .section{ padding:22px 24px; border-bottom:1px solid var(--border-soft); }
  .section-title{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:0 0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .section-title .badge{
    font-family:var(--font-mono);
    color:var(--accent);
    font-size:12px;
    background:var(--accent-soft);
    padding:3px 8px;
    border-radius:20px;
  }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; min-width:0; }
  .field-grid-time{ grid-template-columns:1fr 1fr; }
  .field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .field label{ font-size:12px; color:var(--text-dim); font-weight:500; }
  .field input{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:var(--font-body);
    font-size:15px;
    padding:10px 12px;
    outline:none;
    width:100%;
    max-width:100%;
    min-width:0;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  
  /* Fix de renderização para iOS Safari (iPhone) e navegadores móveis */
  input[type="time"], input[type="date"]{
    color-scheme:light;
    -webkit-appearance:none;
    appearance:none;
    min-height:42px;
  }
  input[type="date"]::-webkit-date-and-time-value,
  input[type="time"]::-webkit-date-and-time-value {
    text-align:left;
    min-height:1.2em;
  }

  .computed-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .computed{
    display:flex; flex-direction:column; gap:4px;
    background:var(--surface-2);
    border:1px dashed var(--border);
    border-radius:var(--radius-sm);
    padding:10px 12px;
  }
  .computed .label{ font-size:11px; color:var(--text-dim); }
  .computed .value{ font-family:var(--font-mono); font-size:15px; color:var(--accent); font-weight:500; }

  .vendor-hint{ font-size:12px; color:var(--text-faint); margin:-6px 0 14px; }
  .vendor-empty{
    font-size:13px; color:var(--text-faint); text-align:center;
    padding:16px 10px; border:1px dashed var(--border); border-radius:var(--radius-sm);
    margin-bottom:12px;
  }
  .vendor-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
  .vendor-list:empty{ margin-bottom:0; }
  .vendor-row{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 12px;
  }
  .vendor-fields{ display:grid; grid-template-columns:26px 1fr 58px 28px; gap:8px; align-items:center; }
  .vendor-rank{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
    border:1px solid var(--border);
  }
  .vendor-row[data-rank="1"] .vendor-rank{
    background:var(--accent); color:#f4fbf5; border-color:var(--accent); font-weight:600;
  }
  .vendor-fields input{
    background:transparent; border:none; color:var(--text);
    font-family:var(--font-body); font-size:14px; padding:6px 4px;
    outline:none; width:100%; border-radius:6px;
  }
  .vendor-fields input.vendor-qty{ text-align:center; font-family:var(--font-mono); }
  .vendor-fields input:focus{ background:var(--surface); }
  .vendor-remove{
    width:26px;height:26px;border-radius:50%;
    border:1px solid var(--border); background:transparent;
    color:var(--text-faint); cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:12px; transition:.15s;
  }
  .vendor-remove:hover{ color:var(--danger); border-color:var(--danger); }
  .vendor-bar-track{ height:5px; border-radius:3px; background:var(--surface); margin-top:8px; overflow:hidden; }
  .vendor-bar-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    border-radius:3px; transition:width .3s ease;
  }
  .add-vendor{
    width:100%; padding:10px; border:1px dashed var(--border);
    border-radius:var(--radius-sm); background:transparent; color:var(--text-dim);
    font-family:var(--font-body); font-size:13px; cursor:pointer; transition:.15s;
  }
  .add-vendor:hover{ border-color:var(--accent); color:var(--accent); }

  .receipt-wrap{ padding:22px 24px 26px; }
  .receipt{ background:var(--paper); border-radius:var(--radius-md); overflow:hidden; }
  .perforation{
    height:14px;
    background-image:radial-gradient(circle at 7px 7px, var(--surface) 4px, transparent 4.5px);
    background-size:14px 14px; background-repeat:repeat-x; background-color:var(--paper);
  }
  .receipt-body{
    padding:20px 18px 6px;
    font-family:var(--font-mono);
    font-size:13px; line-height:1.7;
    color:#243228;
    white-space:pre-wrap; word-break:break-word;
  }
  .receipt-hint{
    text-align:center; font-size:11px; color:var(--text-faint);
    padding:4px 18px 16px;
  }
  .copy-btn{
    width:calc(100% - 36px); margin:0 18px 18px;
    padding:13px; border:none; border-radius:var(--radius-sm);
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#0e2e1e; font-family:var(--font-display); font-weight:600;
    font-size:14px; letter-spacing:.02em; cursor:pointer;
    transition:transform .15s ease, filter .15s ease;
  }
  .copy-btn:hover{ filter:brightness(1.08); }
  .copy-btn:active{ transform:scale(.98); }
  .copy-btn.copied{ background:linear-gradient(135deg,#7cd992,#a9e6b8); }

  @media (max-width:360px){
    .field-grid{ gap:8px; }
    .vendor-fields{ grid-template-columns:22px 1fr 48px 26px; gap:6px; }
    .card-header, .section, .receipt-wrap{ padding-left:18px; padding-right:18px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="card">

    <header class="card-header">
      <div class="header-icon">💊</div>
      <div class="header-text">
        <p class="eyebrow">Painel</p>
        <h1>Parcial de Vendas</h1>
      </div>
    </header>

    <section class="section">
      <p class="section-title">Resumo do dia</p>
      <div class="field-grid field-grid-time">
        <div class="field">
          <label for="inputHora">Hora</label>
          <input type="time" id="inputHora">
        </div>
        <div class="field">
          <label for="inputDia">Dia</label>
          <input type="date" id="inputDia">
        </div>
      </div>
      <div class="field-grid" style="margin-top:12px;">
        <div class="field">
          <label for="inputFaturamento">Faturamento</label>
          <input type="text" id="inputFaturamento" inputmode="numeric" placeholder="0,00">
        </div>
        <div class="field">
          <label for="inputCampanhas">Campanhas</label>
          <input type="number" id="inputCampanhas" min="0" inputmode="numeric" placeholder="0">
        </div>
      </div>
    </section>

    <section class="section">
      <p class="section-title">Vendedores <span class="badge" id="valuePoli">00</span></p>
      <p class="vendor-hint">A ordem muda sozinha: quem vende mais fica em cima.</p>
      <p class="vendor-empty" id="vendorEmpty">Nenhum atendente adicionado ainda</p>
      <div class="vendor-list" id="vendorList"></div>
      <button type="button" class="add-vendor" id="btnAddVendor">+ Adicionar atendente</button>
    </section>

    <section class="section">
      <p class="section-title">Clientes atendidos</p>
      <div class="field-grid">
        <div class="field">
          <label for="inputBalcao">Balcão</label>
          <input type="number" id="inputBalcao" min="0" inputmode="numeric" placeholder="0">
        </div>
        <div class="field">
          <label for="inputEntregas">Entregas</label>
          <input type="number" id="inputEntregas" min="0" inputmode="numeric" placeholder="0">
        </div>
      </div>
      <div class="computed-row">
        <div class="computed">
          <span class="label">Total</span>
          <span class="value" id="valueTotal">00</span>
        </div>
        <div class="computed">
          <span class="label">TKM</span>
          <span class="value" id="valueTkm">R$ 0,00</span>
        </div>
      </div>
    </section>

    <section class="receipt-wrap">
      <p class="section-title">Mensagem pronta</p>
      <div class="receipt">
        <div class="perforation"></div>
        <div class="receipt-body" id="receiptBody"></div>
        <p class="receipt-hint">Toque em copiar e cole direto no WhatsApp</p>
        <button type="button" class="copy-btn" id="btnCopy">Copiar mensagem 📋</button>
      </div>
    </section>

  </div>
</div>

<script>
(function(){
  const inputHora = document.getElementById('inputHora');
  const inputDia = document.getElementById('inputDia');
  const inputFaturamento = document.getElementById('inputFaturamento');
  const inputCampanhas = document.getElementById('inputCampanhas');
  const vendorList = document.getElementById('vendorList');
  const vendorEmpty = document.getElementById('vendorEmpty');
  const btnAddVendor = document.getElementById('btnAddVendor');
  const valuePoli = document.getElementById('valuePoli');
  const inputBalcao = document.getElementById('inputBalcao');
  const inputEntregas = document.getElementById('inputEntregas');
  const valueTotal = document.getElementById('valueTotal');
  const valueTkm = document.getElementById('valueTkm');
  const receiptBody = document.getElementById('receiptBody');
  const btnCopy = document.getElementById('btnCopy');

  function pad2(n){
    n = Math.max(0, Math.round(n || 0));
    return String(n).padStart(2, '0');
  }

  function formatBRL(value){
    value = isFinite(value) ? value : 0;
    return 'R$ ' + value.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function formatDateBR(isoDate){
    if(!isoDate) return '--/--/----';
    const [y,m,d] = isoDate.split('-');
    return `${d}/${m}/${y}`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Máscara de moeda ----------
  function attachCurrencyMask(input){
    input.addEventListener('input', () => {
      let digits = input.value.replace(/\D/g, '');
      if(digits === '') digits = '0';
      digits = digits.replace(/^0+(?=\d)/, '');
      while(digits.length < 3) digits = '0' + digits;
      const cents = digits.slice(-2);
      let intPart = digits.slice(0, -2).replace(/^0+(?=\d)/, '') || '0';
      intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      input.value = intPart + ',' + cents;
      requestAnimationFrame(() => input.setSelectionRange(input.value.length, input.value.length));
      render();
    });
  }
  function getCurrencyValue(input){
    const num = input.value.replace(/\./g, '').replace(',', '.');
    const v = parseFloat(num);
    return isFinite(v) ? v : 0;
  }

  // ---------- Atendentes ----------
  function createVendorRow(name, qty){
    const row = document.createElement('div');
    row.className = 'vendor-row';
    row.innerHTML = `
      <div class="vendor-fields">
        <div class="vendor-rank">-</div>
        <input type="text" class="vendor-name" placeholder="Nome do atendente" aria-label="Nome do atendente" value="${escapeHtml(name)}">
        <input type="number" class="vendor-qty" min="0" inputmode="numeric" aria-label="Quantidade vendida" placeholder="0" value="${qty || ''}">
        <button type="button" class="vendor-remove" aria-label="Remover atendente">✕</button>
      </div>
      <div class="vendor-bar-track"><div class="vendor-bar-fill"></div></div>
    `;
    const nameInput = row.querySelector('.vendor-name');
    const qtyInput = row.querySelector('.vendor-qty');
    const removeBtn = row.querySelector('.vendor-remove');

    nameInput.addEventListener('input', render);
    qtyInput.addEventListener('input', render);
    nameInput.addEventListener('blur', sortVendorRows);
    qtyInput.addEventListener('blur', sortVendorRows);
    removeBtn.addEventListener('click', () => { row.remove(); render(); });

    return row;
  }

  function getVendorRows(){
    return Array.from(vendorList.querySelectorAll('.vendor-row')).map(row => ({
      row,
      name: row.querySelector('.vendor-name').value.trim(),
      qty: parseInt(row.querySelector('.vendor-qty').value, 10) || 0
    }));
  }

  function sortVendorRows(){
    const rows = getVendorRows().sort((a, b) => b.qty - a.qty);
    rows.forEach(r => vendorList.appendChild(r.row));
    render();
  }

  function updateVendorVisuals(){
    const rows = getVendorRows();
    const maxQty = Math.max(1, ...rows.map(r => r.qty));
    rows.forEach((r, idx) => {
      const hasData = r.name !== '' || r.qty > 0;
      r.row.querySelector('.vendor-rank').textContent = hasData ? String(idx + 1) : '-';
      r.row.dataset.rank = hasData ? String(idx + 1) : '';
      r.row.querySelector('.vendor-bar-fill').style.width = hasData ? `${(r.qty / maxQty) * 100}%` : '0%';
    });
  }

  btnAddVendor.addEventListener('click', () => {
    const row = createVendorRow('', 0);
    vendorList.appendChild(row);
    render();
    row.querySelector('.vendor-name').focus();
  });

  // ---------- Render ----------
  function render(){
    vendorEmpty.style.display = vendorList.children.length === 0 ? 'block' : 'none';

    const hora = inputHora.value || '00:00';
    const dia = formatDateBR(inputDia.value);
    const faturamento = getCurrencyValue(inputFaturamento);
    const campanhas = parseInt(inputCampanhas.value, 10) || 0;
    const balcao = parseInt(inputBalcao.value, 10) || 0;
    const entregas = parseInt(inputEntregas.value, 10) || 0;
    const total = balcao + entregas;
    const tkm = total > 0 ? faturamento / total : 0;

    const vendorRows = getVendorRows().filter(r => r.name !== '' || r.qty > 0);
    const poli = vendorRows.reduce((s, r) => s + r.qty, 0);

    valuePoli.textContent = pad2(poli);
    valueTotal.textContent = pad2(total);
    valueTkm.textContent = formatBRL(tkm);

    updateVendorVisuals();

    const sorted = [...vendorRows].sort((a, b) => b.qty - a.qty);
    const vendorLines = sorted.map(r => `${pad2(r.qty)} ${r.name || '—'}`).join('\n');

    const texto = [
      `Parcial ${hora}h 📊`,
      '',
      `Dia: ${dia}`,
      `Faturamento: *${formatBRL(faturamento)}*`,
      '',
      `TKM: *${formatBRL(tkm)}*`,
      '',
      `🔹Campanhas: ${pad2(campanhas)}`,
      `🔹Polivitamínicos: ${pad2(poli)}`,
      '',
      vendorLines,
      '',
      'Clientes atendidos',
      `Balcão: ${pad2(balcao)}`,
      `Entregas: ${pad2(entregas)}`,
      `Total: ${pad2(total)}`
    ].join('\n');

    receiptBody.textContent = texto;
  }

  // ---------- Copiar ----------
  btnCopy.addEventListener('click', async () => {
    const text = receiptBody.textContent;
    try{
      await navigator.clipboard.writeText(text);
      showCopied();
    }catch(err){
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); showCopied(); }catch(e){}
      document.body.removeChild(ta);
    }
  });

  function showCopied(){
    const original = btnCopy.textContent;
    btnCopy.textContent = 'Copiado ✓';
    btnCopy.classList.add('copied');
    setTimeout(() => {
      btnCopy.textContent = original;
      btnCopy.classList.remove('copied');
    }, 1800);
  }

  // ---------- Inicialização ----------
  function init(){
    attachCurrencyMask(inputFaturamento);
    [inputHora, inputDia, inputCampanhas, inputBalcao, inputEntregas].forEach(el => {
      el.addEventListener('input', render);
    });

    render();
  }

  init();
})();
</script>
</body>
</html>
